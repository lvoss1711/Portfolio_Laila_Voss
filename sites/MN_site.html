<!DOCTYPE html>

  <!-- Professionelle Schriftart (Inter) -->

  <nav class="navbar">

    </div>
  </nav>

  <!-- Hauptinhalt -->
  <main class="content-wrapper">
    
    <!-- Projekttitel / Header Bereich -->
    <div style="padding: 40px 0 0px 0;">
      <img src="site_assets/MN_header.png" alt="Project Header" style="max-width: 260px; width: 100%; height: auto; display: block;"/>
    </div>

    <!-- Übersicht Sektion (Galerie für Bilder/Inhalte) -->
    <h2>Produktfotos</h2>
    
    <div class="Grid_SB">
      <!-- Beispiel-Container (Passe die Dateinamen der Bilder an deine Ordnerstruktur an) -->
      <div class="container" data-day="1">
        <img src="site_assets/MN_1.png" alt="Mount Natural Content 1" class="selection"/>
      </div>
      <div class="container" data-day="1">
        <img src="site_assets/MN_2.png" alt="Mount Natural Content 2" class="selection"/>
      </div>

        <img src="site_assets/MN_3.png" alt="Mount Natural Content 3" class="selection"/>
      </div>
      <div class="container" data-day="1">
        <img src="site_assets/MN_4.png" alt="Mount Natural Content 4" class="selection"/>
      </div>
    </div>

    <h2>Social-Media Videos</h2>
   
    <div class="Grid_SB">
      <!-- Beispiel-Container (Passe die Dateinamen der Bilder an deine Ordnerstruktur an) -->
      <div class="container" data-day="1">
        <video src="site_assets/MN_1.mp4" alt="Mount Natural Content 1" class="selection" controls ></video>
      </div>
      <div class="container" data-day="1">
        <video src="site_assets/MN_2.mp4" alt="Mount Natural Content 2" class="selection" controls poster="site_assets/thumbnail_MN_2.jpg"></video>
      </div>
      <div class="container" data-day="1">
        <video src="site_assets/MN_3.mp4" alt="Mount Natural Content 3" class="selection" controls poster="site_assets/thumbnail_MN_3.jpg"></video>
      </div>
      <div class="container" data-day="1">
        <video src="site_assets/MN_4.mp4" alt="Mount Natural Content 4" class="selection" controls ></video>
      </div>
    </div>
